name: Haku unified comparison review
on:
  push:
    branches: [fix/libro-criterio-unificado-review]
    paths:
      - '.haku-unified-review.patch'
      - 'tests/libro-comparacion-criterio-unificado.test.cjs'
      - '.github/workflows/haku-unified-review.yml'
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/libro-criterio-unificado-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar base y aplicar sólo el parche probado
        run: |
          mkdir -p /tmp/haku-unified-review
          test "$(git hash-object js/haiku-libro-consultas-v1.js)" = 'a6e4feda1875b56fcb0e3fa6a8bf2cf4621320be'
          test "$(git hash-object js/haiku-libro-servicios-scope-v2.js)" = 'c8834ec60a675758a2c6aa97560d133a599c6e69'
          git apply --check .haku-unified-review.patch
          git apply .haku-unified-review.patch
          test "$(git hash-object js/haiku-libro-consultas-v1.js)" = '00443da261d7fd19a0c552cc3cc3dc9dd3602dda'
          test "$(git hash-object js/haiku-libro-servicios-scope-v2.js)" = '98a327df72a22b0bf7d4fb051fc26244733c102d'
          test "$(git hash-object tests/libro-comparacion-criterio-unificado.test.cjs)" = '88fc2089d13dfd2296c7e00a8c9b2596b0de1aab'
          node --check js/haiku-libro-consultas-v1.js
          node --check js/haiku-libro-servicios-scope-v2.js
          git diff --check
          test "$(git diff --name-only | wc -l)" = 2
          git diff --exit-code -- . ':!js/haiku-libro-consultas-v1.js' ':!js/haiku-libro-servicios-scope-v2.js'
          git diff > /tmp/haku-unified-review/candidate.patch
      - name: Pruebas nativas con fixtures, sin credenciales ni datos de producción
        run: |
          set -o pipefail
          node --test tests/libro-comparacion-criterio-unificado.test.cjs tests/libro-semantica.test.cjs tests/libro-servicio-manual.test.cjs tests/libro-servicios-existentes-finanzas.test.cjs tests/haiku-servicios-identidad-proveniencia.test.cjs tests/libro-servicios-clasificador-canonico.test.cjs tests/libro-servicios-fechas.test.cjs tests/libro-servicios-noche-manual.test.cjs tests/haiku-libro-pagos-aprobacion-manual.test.cjs tests/libro-servicios-letra-amarilla.test.cjs tests/libro-masaje-fragmentos.test.cjs tests/libro-masajes-parser.test.cjs tests/libro-titular-fragmentos.test.cjs tests/libro-fullday-titular-mismo-fragmento.test.cjs tests/libro-beneficio-tinaja-notas.test.cjs tests/libro-masaje-registro-cuna-acciones.test.cjs tests/libro-resultado-incorporados.test.cjs tests/haiku-libro-reconciliacion.test.cjs tests/haiku-libro-pendientes.test.cjs 2>&1 | tee /tmp/haku-unified-review/tests.tap
      - name: Guardar módulos verificados únicamente en la rama de revisión
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/haiku-libro-consultas-v1.js js/haiku-libro-servicios-scope-v2.js
          git commit -m 'fix(libro): unificar criterio mensual con servicios y notas'
          git push origin HEAD:refs/heads/fix/libro-criterio-unificado-review
          git rev-parse HEAD > /tmp/haku-unified-review/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haku-unified-comparison-review
          path: /tmp/haku-unified-review
          retention-days: 7
