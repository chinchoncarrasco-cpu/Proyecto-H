name: Haku guías operativas
on:
  pull_request:
    paths:
      - "js/haiku-guias-operativas-v1.js"
      - "js/haiku-ayuda-v1.js"
      - "js/haiku-asistente-lenguaje-v1.js"
      - "js/haiku-asistente-acciones-v1.js"
      - "js/haiku-asistente-operaciones-v1.js"
      - "js/supabase-asistente-operaciones-v1.js"
      - "js/supabase-asistente-bove-escritura-v1.js"
      - "js/supabase-asistente-totales-v1.js"
      - "js/sites-resumen-servicio-v1.js"
      - "js/supabase-asistente-v1.js"
      - "js/haiku-cloudbeds-informes-v1.js"
      - "js/supabase-asistente-cloudbeds-informes-v1.js"
      - "js/haiku-cloudbeds-pdf-v1.js"
      - "js/supabase-libro-reserva-worker-v1.js"
      - "js/haiku-libro-consultas-v1.js"
      - "js/supabase-asistente-historial-v1.js"
      - "js/supabase-asistente-libro-auto-v1.js"
      - "css/sites-asistente-v1.css"
      - "css/supabase-asistente-v1.css"
      - "assets/guias/**"
      - "tests/haku-guias-operativas*.cjs"
      - "tests/haku-lenguaje-operativo.test.cjs"
      - "tests/haku-operaciones-*.cjs"
      - "tests/bove-*.cjs"
      - "supabase/migrations/*_haku_operaciones_chat.sql"
      - "supabase/migrations/20260910180000_bove_registro_atomico.sql"
      - "tests/haku-ayuda-browser-check.cjs"
      - "tests/cloudbeds-informes.test.cjs"
      - "tests/totales-asistente.test.cjs"
      - "tests/resumen-servicio-sites.test.cjs"
      - "panel.html"
      - "tests/haku-comparacion-mes-siguiente-browser-check.cjs"
      - ".github/workflows/haku-guias-operativas.yml"
permissions:
  contents: read
jobs:
  guias:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reglas de los manuales y contratos del asistente
        run: >-
          node --test tests/haku-guias-operativas.test.cjs tests/haku-panel-scroll.test.cjs
          tests/haku-reserva-convivencia-v1.test.cjs tests/airbnb-prepaid-card.test.cjs tests/haiku-libro-auto.test.cjs
          tests/haku-lenguaje-operativo.test.cjs tests/totales-asistente.test.cjs tests/resumen-servicio-sites.test.cjs
          tests/haku-operaciones-chat.test.cjs tests/bove-escritura-*.test.cjs tests/bove-routing.test.cjs
          tests/cloudbeds-informes.test.cjs tests/cloudbeds-pdf.test.cjs tests/cloudbeds-haku-tarifas-2e.test.cjs
      - name: Navegador aislado
        run: |
          npm install --prefix "$RUNNER_TEMP/haku-guias" --no-save --ignore-scripts --package-lock=false playwright@1.56.1 @electric-sql/pglite@0.5.8
          node "$RUNNER_TEMP/haku-guias/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Confirmaciones de Haku y BOVE en PostgreSQL aislado
        env:
          NODE_PATH: ${{ runner.temp }}/haku-guias/node_modules
        run: |
          node tests/haku-operaciones-postgres.cjs
          node tests/bove-rpc-postgres.cjs
      - name: Guías reales en escritorio y móvil, historial y consulta en curso
        env:
          NODE_PATH: ${{ runner.temp }}/haku-guias/node_modules
        run: node tests/haku-guias-operativas-browser-check.cjs
      - name: Acciones rápidas y consultas de titulares
        env:
          NODE_PATH: ${{ runner.temp }}/haku-guias/node_modules
        run: node tests/haku-comparacion-mes-siguiente-browser-check.cjs
      - name: Ayuda, lenguaje natural y formularios en ambos temas
        env:
          NODE_PATH: ${{ runner.temp }}/haku-guias/node_modules
        run: node tests/haku-ayuda-browser-check.cjs
      - name: Capturas de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haku-guias-capturas
          path: ${{ runner.temp }}/haku-guias-capturas/*.png
          if-no-files-found: ignore
          retention-days: 7
