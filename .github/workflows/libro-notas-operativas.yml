name: Haku notas y servicios del Libro

on:
  pull_request:
    paths:
      - "js/haiku-libro-semantica-v1.js"
      - "js/haiku-libro-consultas-v1.js"
      - "js/haiku-libro-contexto-v1.js"
      - "js/haiku-libro-diferencias-v1.js"
      - "js/haiku-libro-servicios-scope-v2.js"
      - "js/haiku-reprogramacion-estadia-v1.js"
      - "js/supabase-asistente-operaciones-v1.js"
      - "js/haiku-asistente-acciones-v1.js"
      - "js/haiku-servicios-identidad-v1.js"
      - "js/supabase-servicios-hidratacion-v2.js"
      - "js/supabase-ficha-v2.js"
      - "js/sites-servicios-v1.js"
      - "css/haiku-reprogramacion-estadia-v1.css"
      - "tests/libro-reprogramacion*.cjs"
      - "tests/fixtures/libro-reprogramacion-sql.cjs"
      - "tests/fixtures/reprogramacion-guardas.sql"
      - "supabase/migrations/*_libro_reprogramacion_estadia_atomica.sql"
      - "supabase/migrations/*_libro_reprogramacion_revision_noches.sql"
      - "js/sites-resumen-reserva-v1.js"
      - "js/supabase-historial-v1.js"
      - "tests/libro-notas-insumos-tinaja.test.cjs"
      - "tests/libro-tinaja-reemplazo.test.cjs"
      - "tests/libro-tinaja-reemplazo-browser-check.cjs"
      - "tests/libro-titular-fragmentos.test.cjs"
      - "tests/libro-roles-contexto.test.cjs"
      - "tests/libro-cortesia-confirmacion-directa.test.cjs"
      - "js/haiku-libro-confirm-cancel-fix-v1.js"
      - "tests/libro-servicio-confirmacion-unica.test.cjs"
      - "tests/libro-personas-adultos.test.cjs"
      - "tests/libro-resoluciones-ocupacion.test.cjs"
      - "tests/libro-servicio-manual-postgres.test.cjs"
      - "tests/libro-auditoria-servicios-notas.test.cjs"
      - "tests/libro-retiros-*.cjs"
      - "tests/libro-lote-cambios-seguros.test.cjs"
      - "tests/gestion-ajustes-reserva-postgres.test.cjs"
      - "supabase/migrations/*_libro_cancelacion_segura_lote.sql"
      - "supabase/migrations/*_gestion_ajustes_reserva.sql"
      - "tests/libro-masaje-registro-cuna-acciones.test.cjs"
      - "tests/libro-historial-manual-browser-check.cjs"
      - "css/sites-asistente-v1.css"
      - "supabase/migrations/*_libro_late_checkout_cortesia_v1.sql"
      - ".github/workflows/libro-notas-operativas.yml"

permissions:
  contents: read

jobs:
  reservas-y-servicios:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Notas, identidad, horarios, cobro y reservas del Libro
        run: node --test tests/libro-notas-insumos-tinaja.test.cjs tests/libro-titular-fragmentos.test.cjs tests/libro-servicios-clasificador-canonico.test.cjs tests/libro-servicios-letra-amarilla.test.cjs tests/libro-servicios-fechas.test.cjs tests/libro-fullday-titular-mismo-fragmento.test.cjs tests/libro-semantica.test.cjs tests/libro-aprobacion-admin.test.cjs tests/libro-tinaja-reemplazo.test.cjs tests/libro-tinaja-cambio-color.test.cjs tests/haiku-servicios-idempotencia.test.cjs
      - name: Ocupación del Libro, huéspedes y adultos
        run: node --test tests/libro-personas-adultos.test.cjs tests/libro-resoluciones-ocupacion.test.cjs tests/libro-fullday-tarifa-adl.test.cjs
      - name: Roles, aseo, notas, pagos y profesionales del Libro
        run: node --test tests/libro-roles-contexto.test.cjs tests/libro-reservas-identificacion.test.cjs tests/libro-notas-evidencia-propia.test.cjs tests/libro-pagos-lectura-estable.test.cjs tests/libro-masajes-parser.test.cjs tests/libro-masaje-fragmentos.test.cjs
      - name: Diferencias y lectura de servicios y notas del mes
        run: node --test tests/libro-auditoria-servicios-notas.test.cjs tests/libro-masaje-registro-cuna-acciones.test.cjs tests/libro-retiros-modificaciones.test.cjs tests/haku-asistente-servicios-cancelacion-rpc.test.cjs
      - name: Confirmación de cortesía sin altas duplicadas ni revisión repetida
        run: node --test tests/libro-servicio-confirmacion-unica.test.cjs tests/libro-historial-revision-operativa.test.cjs tests/libro-cortesia-confirmacion-directa.test.cjs tests/libro-servicio-manual.test.cjs tests/libro-servicio-manual-compacto.test.cjs tests/haku-asistente-servicios-cortesia.test.cjs tests/haku-asistente-servicios-cortesia-rpc.test.cjs
      - name: Dependencias aisladas de prueba
        run: npm install --prefix "$RUNNER_TEMP/haku-libro-test" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.14 playwright@1.56.1
      - name: PostgreSQL aislado, auditoría y conservación de pagos
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
        run: node --test tests/libro-aprobacion-admin-postgres.test.cjs tests/libro-servicio-manual-postgres.test.cjs tests/libro-retiros-notas-postgres.test.cjs tests/gestion-ajustes-reserva-postgres.test.cjs
      - name: Chromium de prueba
        run: node "$RUNNER_TEMP/haku-libro-test/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Reprogramación conjunta, permisos, disponibilidad y conservación financiera
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
        run: node --test tests/libro-reprogramacion.test.cjs tests/libro-reprogramacion-postgres.test.cjs tests/libro-reprogramacion-noches-postgres.test.cjs tests/libro-lote-cambios-seguros.test.cjs
      - name: Reprogramación desde Haku y Libro en ambos tamaños y temas
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
          HAKU_REPROGRAMACION_EVIDENCIA: ${{ runner.temp }}/haku-reprogramacion-sintetica
        run: node tests/libro-reprogramacion-browser-check.cjs
      - name: Ampliar/reducir desde Haku y revisar ingreso/salida registrados
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
          HAKU_REPROGRAMACION_EVIDENCIA: ${{ runner.temp }}/haku-reprogramacion-noches-sintetica
        run: node tests/libro-reprogramacion-noches-browser-check.cjs
      - name: Cambio del Libro en escritorio y teléfono
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
        run: node tests/libro-tinaja-reemplazo-browser-check.cjs

      - name: Confirmación manual directa en ambos temas y tamaños
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
        run: node tests/libro-historial-manual-browser-check.cjs
      - name: Retiros y modificaciones en las cuatro vistas, ambos temas y tamaños
        env:
          NODE_PATH: ${{ runner.temp }}/haku-libro-test/node_modules
        run: node tests/libro-retiros-browser-check.cjs
