name: Haku revisión directa

on:
  pull_request:
    paths:
      - "js/sites-cabanas-v1.js"
      - "js/checkout-*.js"
      - "js/cabanas-espacios-v1.js"
      - "tests/cabanas-espacios.test.cjs"
      - "js/supabase-repaso-v2.js"
      - "js/haiku-repaso-checklist-v1.js"
      - "tests/cabanas-repaso-browser-check.cjs"
      - "js/supabase-aseo-revision-v1.js"
      - "js/supabase-aseo-operacion-v1.js"
      - "js/supabase-insumos-aseo-v1.js"
      - "css/sites-cabanas-v1.css"
      - "index.html"
      - "assets/icons/cabanas-chevron.svg"
      - "tests/cabanas-sites.test.cjs"
      - "tests/cabanas-filters-browser-check.cjs"
      - "tests/revision-completa-estados.test.cjs"
      - "tests/aseo-derivado-panel-browser-check.cjs"
      - "tests/cabanas-seguimiento-browser-check.cjs"
      - "tests/solicitudes-tipos-browser-check.cjs"
      - ".github/workflows/cabanas-revision.yml"

permissions:
  contents: read

jobs:
  revision-y-listado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Revisión, Aseo, Realtime y edición de horas
        run: node --test tests/cabanas-sites.test.cjs tests/revision-completa-estados.test.cjs tests/revision-checklist-realtime.test.cjs tests/aseo-operacion-autoridad.test.cjs tests/horas-edicion.test.cjs tests/insumos-aseo.test.cjs tests/insumos-realtime-ready.test.cjs
      - name: Navegador aislado de prueba
        run: |
          npm install --prefix "$RUNNER_TEMP/haku-ui" --no-save --ignore-scripts --package-lock=false playwright@1.56.1 linkedom@0.18.12
          node "$RUNNER_TEMP/haku-ui/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Insumos y salidas con contexto de estadía
        env:
          NODE_PATH: ${{ runner.temp }}/haku-ui/node_modules
        run: node --test tests/cabanas-espacios.test.cjs
      - name: Listado real en escritorio y teléfono
        env:
          NODE_PATH: ${{ runner.temp }}/haku-ui/node_modules
        run: node tests/aseo-derivado-panel-browser-check.cjs
      - name: Seguimiento, resumen compacto y destinos en ambos temas
        env:
          NODE_PATH: ${{ runner.temp }}/haku-ui/node_modules
        run: node tests/cabanas-seguimiento-browser-check.cjs
      - name: Solicitudes por tipo y revisión Express automática
        env:
          NODE_PATH: ${{ runner.temp }}/haku-ui/node_modules
        run: node tests/solicitudes-tipos-browser-check.cjs
      - name: Repaso independiente, optimismo y No requiere en ambos temas
        env:
          NODE_PATH: ${{ runner.temp }}/haku-ui/node_modules
        run: node tests/cabanas-repaso-browser-check.cjs
      - name: Filtros por columna con tipo de revisión activo y conteos
        env:
          NODE_PATH: ${{ runner.temp }}/haku-ui/node_modules
        run: node tests/cabanas-filters-browser-check.cjs
