name: Haku service identity review

on:
  push:
    branches: [fix/libro-servicios-existentes-estado-pago]
    paths:
      - '.haku-review-service-fix.py'
      - 'tests/libro-servicios-existentes-finanzas.test.cjs'
      - '.github/workflows/haku-review-service-identity.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/libro-servicios-existentes-estado-pago'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baseline sin nuevas pruebas
        run: |
          set -o pipefail
          mkdir -p /tmp/haku-review
          node --test tests/libro-servicio-manual.test.cjs 2>&1 | tee /tmp/haku-review/baseline.tap
      - name: Aplicar sólo el parche revisado
        run: |
          python3 .haku-review-service-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/haiku-libro-servicios-scope-v2.js')
          s=p.read_text()
          old='        for (const item of registrados) item.finanzas_existente = desconocido();'
          new="        for (const item of registrados) item.finanzas_existente = { ...desconocido(),\n            etiqueta: item.cortesia ? 'cortesía · finanzas por verificar' : 'Pago por verificar' };"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          node --check js/haiku-libro-servicios-scope-v2.js
          git diff --check
          test "$(git diff --name-only)" = 'js/haiku-libro-servicios-scope-v2.js'
          git diff > /tmp/haku-review/candidate.patch
      - name: Identidad, pagos y regresiones - sólo fixtures, sin Supabase
        run: |
          set -o pipefail
          node --test tests/libro-servicio-manual.test.cjs tests/libro-servicios-existentes-finanzas.test.cjs tests/haiku-servicios-identidad-proveniencia.test.cjs tests/libro-servicios-clasificador-canonico.test.cjs tests/libro-servicios-fechas.test.cjs tests/libro-servicios-noche-manual.test.cjs tests/haiku-libro-pagos-aprobacion-manual.test.cjs tests/libro-semantica.test.cjs 2>&1 | tee /tmp/haku-review/tests.tap
      - name: Navegador real sin datos ni escrituras de producción
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const {read,source,setup,consulta}=require('./tests/fixtures/libro-servicio-manual.cjs');
          const boot=async function(){
            try {
              const f=fixtureServicios,r=f.reservas[0],est=f.db.reserva_estadias[0];
              r.texto_original='X PAGAR LATE OUT CLP$10,000 1 HORA';
              r.servicios=HAIKU_LIBRO_SEMANTICA.servicios(r.texto_original,{origen_campo:'notas_reserva'});
              const s={id:'late-prueba',reserva_id:est.reserva_id,estadia_id:est.id,
                fecha_servicio:r.fecha_checkout,hora_inicio:'13:00:00',hora_fin:'14:00:00',
                cantidad:1,personas:2,total:10000,tipo_cobro:'normal',estado_servicio:'programado',
                catalogo_servicios:{codigo:'lateCheckout',nombre:'Late Check-out'}};
              const cargo={cargo_id:'cargo-prueba',reserva_id:s.reserva_id,estadia_id:s.estadia_id,
                servicio_id:s.id,monto:10000,monto_ajustado:10000,aplicado_neto:10000,saldo_cargo:0,estado:'activo'};
              f.db.servicios=[s];f.db.vista_estado_cargos=[cargo];
              window.haikuTienePermiso=p=>p==='pagos.ver';
              const out=document.getElementById('out'),api=HAIKU_LIBRO_SERVICIOS_SCOPE_V2;
              const resultados=[];
              for(const [aplicado,saldo,estado] of [[10000,0,'pagado'],[0,10000,'pendiente'],[4000,6000,'parcial']]){
                cargo.aplicado_neto=aplicado;cargo.saldo_cargo=saldo;
                const plan=await api.construir(window.q);
                const item=plan.items.find(x=>x.kind==='servicio'&&x.reserva.titular===r.titular);
                if(item.estado!=='existente'||item.payload!==null||item.finanzas_existente.estado!==estado)throw Error('Identidad/finanzas '+estado);
                api.renderizar(plan,out,window.q);
                const lista=out.querySelector('.haku-libro-servicios__seccion--existentes');
                lista.open=true;
                const revision=out.querySelector('.haku-libro-servicios__seccion--revision');
                if(revision.textContent.includes(r.titular))throw Error('Servicio repetido en revisión');
                if(!lista.textContent.includes(item.finanzas_existente.etiqueta))throw Error('Etiqueta ausente en pantalla');
                if(!lista.querySelector('input').disabled)throw Error('Permite incorporar duplicado');
                resultados.push(estado+': existente, etiqueta visible, no incorporable');
              }
              if(f.escrituras.length)throw Error('Escritura no autorizada');
              document.body.dataset.hakuReview='pass';
              const p=document.createElement('pre');p.id='resultado';p.textContent=JSON.stringify(resultados);document.body.append(p);
            }catch(e){document.body.dataset.hakuReview='fail';document.body.append(String(e.stack||e));}
          };
          const code=[read('js/haiku-libro-semantica-v1.js'),read('js/haiku-servicios-identidad-v1.js'),
            '('+setup.toString()+')();',source,'window.q='+JSON.stringify(consulta)+';', '('+boot.toString()+')();'].join('\n');
          fs.writeFileSync('/tmp/haku-review/browser.html','<!doctype html><meta charset="utf-8"><body><div id="out"></div><script>'+code.replace(/<\/script/gi,'<\\/script')+'</script>');
          JS
          CHROME=$(command -v google-chrome || command -v chromium)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-background-networking --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom file:///tmp/haku-review/browser.html > /tmp/haku-review/browser-result.html 2>/tmp/haku-review/browser-stderr.txt
          grep -q '<body data-haku-review="pass">' /tmp/haku-review/browser-result.html
          echo '3 escenarios en navegador real PASS; 0 escrituras de producción' | tee /tmp/haku-review/browser-summary.txt
      - name: Guardar sólo código verificado en la rama de revisión
        run: |
          test "$(git diff --name-only)" = 'js/haiku-libro-servicios-scope-v2.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/haiku-libro-servicios-scope-v2.js
          git commit -m 'fix(libro): reconocer servicios únicos sin hora y mostrar su saldo real'
          git push origin HEAD:refs/heads/fix/libro-servicios-existentes-estado-pago
          git rev-parse HEAD > /tmp/haku-review/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haku-service-identity-review
          path: /tmp/haku-review
          retention-days: 7
