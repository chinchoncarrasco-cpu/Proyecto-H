name: Haku horas web

on:
  pull_request:
    paths:
      - "js/haiku-horas-edicion-v1.js"
      - "tests/horas-edicion*"
      - "index.html"
      - "panel.html"
      - ".github/workflows/horas-edicion.yml"

permissions:
  contents: read

concurrency:
  group: horas-edicion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teclado-y-guardado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Eventos y regresión de Aseo
        run: node --test tests/horas-edicion.test.cjs tests/aseo-operacion-autoridad.test.cjs tests/resumen-filas-persistentes.test.cjs
      - name: Instalar navegador sólo para esta prueba
        run: |
          npm install --prefix "$RUNNER_TEMP/haku-horas" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/haku-horas/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Escribir cuatro dígitos con teclado real
        env:
          NODE_PATH: ${{ runner.temp }}/haku-horas/node_modules
        run: node tests/horas-edicion-browser-check.cjs
