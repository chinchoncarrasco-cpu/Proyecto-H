<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso interno</title>
    <link rel="icon" href="data:,">
    <style>
        html, body { margin: 0; min-height: 100%; background: #151515; color: #f2f2f2; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .haiku-loader { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
        .haiku-loader strong { display: block; margin-bottom: 8px; font-size: 1.15rem; }
        .haiku-loader span { color: #aaa; }
    </style>
</head>
<body>
    <div class="haiku-loader"><div><strong>ACCESO INTERNO</strong><span>Preparando conexión segura…</span></div></div>
    <script>
        (async () => {
            "use strict";
            function cargarScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement("script"); script.src = src; script.async = true; script.onload = resolve; script.onerror = () => reject(new Error(`No fue posible cargar ${src}`)); document.head.appendChild(script);
                });
            }
            try {
                await cargarScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
                if (!window.supabase || typeof window.supabase.createClient !== "function") throw new Error("supabase-js no quedó disponible en window.supabase");
                const version = Date.now();
                const respuesta = await fetch(`./index.html?v=${version}`, { cache: "no-store" });
                if (!respuesta.ok) throw new Error(`No fue posible cargar index.html (${respuesta.status})`);
                let html = await respuesta.text();
                html = html.replace(/<title>\s*Haiku\s*<\/title>/i, '<title>Panel interno</title>');
                const estiloArranquePrivado = `<style id="haiku-privacidad-arranque-style">html.haiku-privacidad-arranque::before{content:"";position:fixed;inset:0;z-index:2147483647;display:block;background:#101511;pointer-events:all;}</style>`;
                const scriptArranquePrivado = `<script>(function(){var raiz=document.documentElement;var terminado=false;function liberar(){if(terminado)return;terminado=true;raiz.classList.remove('haiku-privacidad-arranque');}function loginListo(){var overlay=document.querySelector('.haiku-auth-overlay');if(!overlay||overlay.hidden||window.haikuSesion)return false;var estado=document.getElementById('haiku-auth-estado');var texto=(estado&&estado.textContent||'').trim();if(!texto)return false;return !/comprobando\\s+sesión|validando\\s+acceso/i.test(texto);}function privacidadLista(){try{var api=window.HAIKU_PRIVACIDAD;var estado=api&&typeof api.estado==='function'?api.estado():null;return !!(estado&&(estado.modo!=='oculto'||estado.armado===true));}catch(e){return false;}}function revisar(){if(loginListo()||privacidadLista()){requestAnimationFrame(function(){requestAnimationFrame(liberar);});return;}setTimeout(revisar,16);}revisar();})();<` + '/script>';
                html = html.replace('<html lang="es">','<html lang="es" class="haiku-privacidad-arranque">');
                html = html.replace("</head>", `${estiloArranquePrivado}\n</head>`);
                html = html.replace("<body>", `<body>\n${scriptArranquePrivado}`);
                html = html.replace('src="js/cabanas.js"', `src="js/cabanas.js?v=${version}"`);
                html = html.replace("</head>", `<link rel="stylesheet" href="css/supabase-pagos-v4-fix.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-webpay-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-cierre-final-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-cierre-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-historial-v1.css?v=${version}">
<link rel="stylesheet" href="css/supabase-reservas-v1.css?v=${version}">
<link rel="stylesheet" href="css/supabase-reservas-compact-v1.css?v=${version}">
<link rel="stylesheet" href="css/supabase-libro-reserva-v1.css?v=${version}">
<link rel="stylesheet" href="css/supabase-haku-reconciliacion-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-revision-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-cabanas-fotos-v2.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-express-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-express-actions-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-fotos-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-resumen-desktop-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-resumen-fondo-v3.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-reserva-multiple-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-reserva-cambio-cabana-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-reserva-grupo-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-vinculos-estables-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pago-grupo-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-abonos-verificacion-v2.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pagos-checkin-grupo-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-servicios-estados-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pagos-desktop-grid-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pagos-acciones-desktop-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-bloqueo-privacidad-v1.css?v=${version}">\n</head>`);
                const marca = "<!-- JAVASCRIPT -->";
                if (!html.includes(marca)) throw new Error("No se encontró el punto de inserción JAVASCRIPT en index.html");
                const scriptsSupabaseBase = [
                    `<script src="js/supabase-client.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-auth.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-edicion-pre.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-nueva-reserva-fullday-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-data.js?v=${version}"><` + '/script>'
                ].join("\n");
                html = html.replace(marca, `${marca}\n${scriptsSupabaseBase}`);
                const scriptsSupabaseV2 = [
                    'supabase-sync-v3','supabase-bloqueos-calendario-v1','supabase-bloqueos-ui-fix-v1','supabase-resumen-rapido-touch-v1','supabase-ficha-v2','supabase-ficha-ocupacion-rapida-v1','supabase-ficha-comentarios-v1','supabase-reserva-estados-v1','supabase-ficha-modal-guard-v1','supabase-reactivar-canceladas-v2','supabase-pagos-v2','supabase-abonos-detalle-v1','supabase-guard-v2','supabase-pagos-guard-v3','supabase-pagos-checkin-v5','supabase-pagos-pendientes-v1','supabase-ajustes-cargo-v1','supabase-ajustes-cargo-manual-v1','supabase-pagos-monto-formato','supabase-ficha-atajos','supabase-servicios-bridge-v1','supabase-servicios-early-checkin-v1','supabase-servicios-finanzas-v2','supabase-servicios-hidratacion-v2','supabase-servicios-estados-v1','supabase-servicios-pago-bove-v1','supabase-notificaciones-servicios-estados-v1','supabase-servicios-tiempo-v1','supabase-servicios-tinajas-horarios-v1','supabase-servicios-tinajas-copiar-v2','supabase-pagos-checkout-v1','supabase-checkout-resumen-v1','supabase-checkout-autoridad-v1','supabase-calendario-estados-v1','supabase-reserva-calendario-nav','supabase-webpay-v1','supabase-cierre-v1','supabase-cierre-evidencias-v1','supabase-cierre-final-v1','supabase-cierre-autorefresh-v1','supabase-historial-v1','supabase-reservas-v1','supabase-reservas-copiar-v1','supabase-libro-reserva-v1','haiku-libro-semantica-v1','haiku-libro-diferencias-v1','haiku-libro-pagos-canon-v1','haiku-libro-lenguaje-natural-v1','haiku-libro-consulta-anual-ui-v1','haiku-libro-servicios-scope-v2','haiku-libro-pagos-focalizados-v1','haiku-libro-consultas-v1','haiku-libro-reconciliacion-ux-v1','supabase-notas-resumen-v1','supabase-aseo-revision-v1','supabase-revision-ui-v1','supabase-cabanas-fotos-v1','supabase-revision-resumen-sync-v2','supabase-aseo-estado-sync-v1','supabase-aseo-express-ui-v1','supabase-aseo-operacion-v1','supabase-aseo-realtime-v1','supabase-auth-menu-v1','supabase-reserva-multiple-v1','supabase-reserva-cambio-cabana-v2','supabase-reserva-cambio-cabana-v1','supabase-reserva-cambio-cabana-vinculo-v1','supabase-reserva-grupo-v1','supabase-vinculos-estables-v1','supabase-pago-grupo-v1','supabase-editar-abono-saldo-favor-v1','supabase-editar-abonos-v1','supabase-abonos-verificacion-v2','supabase-pagos-checkin-grupo-v2','supabase-saldo-favor-v2','supabase-bloqueo-privacidad-v1','supabase-asistente-pagos-nocturnos-v1','supabase-asistente-pago-existente-v2','supabase-asistente-estados-v1','supabase-asistente-aseo-v1','supabase-asistente-aseo-contexto-v1','supabase-asistente-consulta-ingresos-v1','supabase-asistente-resumen-dia-v1','supabase-asistente-disponibilidad-v1','supabase-asistente-actividad-hoy-v1','supabase-asistente-listado-cloudbeds-v2','supabase-asistente-confirmadas-sin-abono-v1','supabase-autoridad-visual-final-v1'
                ].map(n => `<script src="js/${n}.js?v=${version}"><` + '/script>').join("\n");
                html = html.replace("</body>", `${scriptsSupabaseV2}\n</body>`);
                document.open(); document.write(html); document.close();
            } catch (error) {
                console.error("PANEL · No fue posible iniciar versión Supabase:", error);
                document.body.innerHTML = `<div class="haiku-loader"><div><strong>No fue posible iniciar</strong><span>Recarga la página. Si continúa, revisa la consola.</span></div></div>`;
            }
        })();
    </script>
</body>
</html>
