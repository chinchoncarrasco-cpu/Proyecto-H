<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' 'self'; script-src 'unsafe-inline' 'self'; img-src 'self' data: blob: https://zqfegylkylxsuoejomow.supabase.co/storage/v1/; font-src 'self'; form-action 'none'; base-uri 'none'">
<title>Mapa del recinto · Haku</title>
<style>
:root {
  color-scheme: light;
  --page: #faf6ee;
  --map: #f5efe5;
  --maipo-water: #e5eef0;
  --maipo-flow: #cbdde1;
  --maipo-slope: #e5e2d3;
  --maipo-gravel: #d9d3c0;
  --maipo-bar: #e0dfd5;
  --maipo-bar-edge: #c7c9bd;
  --maipo-relief: #a9ab94;
  --maipo-scrub: #a3ae95;
  --paper: #fffaf3;
  --line: #e1d5ce;
  --ink: #2a2228;
  --sub: #665a65;
  --accent: #78263f;
  --accent-ink: #fff7f9;
  --tint: #f4e6e8;
  --outline: #a58e9b;
  --free: #f3eee9;
  --continuing: #ead3df;
  --arrival: #e4e0f3;
  --departure: #f3deca;
  --checkout: #e9e3d9;
  --blocked: #e3dcdf;
  --full: #f2d9bd;
  --unknown: #e9dfd6;
  --ready: #318051;
  --working: #bd5e26;
  --waiting: #986d0d;
  --parking-reserved: #f7c999;
  --parking-reserved-outline: #a95417;
  --parking-away-opacity: .42;
  --vehicle-body: #d399aa;
  --vehicle-outline: var(--accent);
  --vehicle-windows: #f9f0f3;
  --vehicle-wheel: #584551;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #201a20;
  --map: #29262d;
  --maipo-water: #1f303a;
  --maipo-flow: #38535d;
  --maipo-slope: #343832;
  --maipo-gravel: #44453c;
  --maipo-bar: #343e41;
  --maipo-bar-edge: #4b5654;
  --maipo-relief: #646f5d;
  --maipo-scrub: #515e4d;
  --paper: #2c232b;
  --line: #4e3b47;
  --ink: #f4e9ef;
  --sub: #c5b4c0;
  --accent: #a64f6d;
  --accent-ink: #fff5f7;
  --tint: #482e3a;
  --outline: #887581;
  --free: #3c3740;
  --continuing: #543345;
  --arrival: #354655;
  --departure: #543d2c;
  --checkout: #4b403c;
  --blocked: #4b3d43;
  --full: #624236;
  --unknown: #37323b;
  --ready: #8ed2a6;
  --working: #efa976;
  --waiting: #edc96f;
  --parking-reserved: #764c33;
  --parking-reserved-outline: #efa976;
  --vehicle-body: #9c4d65;
  --vehicle-outline: #f0adbf;
  --vehicle-windows: #392a38;
  --vehicle-wheel: #2c2530;
}
[data-vehicle-color] {--vehicle-outline:var(--sub); --vehicle-windows:#49515c}
* {box-sizing: border-box}
[hidden] {display: none !important}
html, body {height:100%; margin:0; overflow:hidden}
body {font:14px/1.38 Inter, system-ui, sans-serif; color:var(--ink); background:var(--page)}
button, input, select, textarea {font:inherit; color:inherit}
button, input, select, textarea {border:1px solid var(--line); border-radius:8px; background:var(--paper)}
button {min-height:36px; padding:5px 11px; cursor:pointer; font-weight:640}
button:disabled {opacity:.45; cursor:default}
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {outline:2px solid var(--accent); outline-offset:2px}
button.primary {background:var(--accent); color:var(--accent-ink); border-color:transparent}
button[aria-pressed="true"] {background:var(--tint); border-color:var(--accent)}
.workspace {display:flex; flex-direction:column; height:100%; min-width:0}
.toolbar {flex:none; padding:10px 12px 8px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; border-bottom:1px solid var(--line)}
.heading {display:flex; flex:1 0 auto; gap:7px; align-items:center}
h1, h2, h3, p {margin:0}
h1 {font-size:clamp(17px, 2.6vw, 25px); letter-spacing:-.025em; margin-right:auto}
.heading time {color:var(--sub); white-space:nowrap; font-size:12px}
#reload {font-size:18px; width:36px; padding:3px}
#filters {display:flex; gap:5px; max-width:100%; overflow:auto; scrollbar-width:none}
#filters button {white-space:nowrap}
#status {width:100%; color:var(--sub); font-size:12px}
.content {display:flex; flex:1; min-height:0; position:relative}
#viewport {flex:1; min-width:0; position:relative; overflow:hidden; isolation:isolate; background:var(--map); touch-action:none; cursor:grab; outline-offset:-3px}
#viewport[data-dragging="true"] {cursor:grabbing}
#viewport.placing, #viewport.placing .region {cursor:crosshair}
/* Let the browser redraw the vectors at the current zoom scale. */
#world {position:absolute; width:1136px; height:1578px; transform-origin:0 0; user-select:none}
#base, #regions {position:absolute; inset:0; width:1136px; height:1578px; pointer-events:none}
#base svg {display:block}
#maipo-context {position:absolute; top:0; left:-920px; pointer-events:none}
.region {cursor:pointer; pointer-events:all; outline:none}
.region .hit {fill:transparent; stroke:transparent; stroke-width:1.8}
.region[aria-current="true"] .hit, .region:focus-visible .hit {fill:var(--tint); fill-opacity:.18; stroke:var(--accent); stroke-width:3}
.region[data-parking-reserved] .hit {fill:var(--parking-reserved); fill-opacity:1; stroke:var(--parking-reserved-outline)}
.region[data-parking-hosted] .hit {stroke:var(--ready); stroke-width:2.8}
.region[data-parking-hosted][data-vehicle-away] .hit {stroke-opacity:var(--parking-away-opacity)}
.region[data-vehicle-away] .parking-car {opacity:var(--parking-away-opacity)}
.region .footprint {stroke:var(--outline); stroke-width:2; stroke-linejoin:round}
.region[aria-current="true"] .footprint, .region:focus-visible .footprint {stroke:var(--accent); stroke-width:3}
.region text, .river {fill:var(--ink); font-weight:700; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:var(--map); stroke-width:1.8; pointer-events:none}
.region .parking-name {pointer-events:painted}
.region .zone-tag {fill:var(--paper); stroke:var(--line); stroke-width:1.25}
.region[aria-current="true"] .zone-tag, .region:focus-visible .zone-tag {stroke:var(--accent); stroke-width:2.5}
.river {fill:var(--sub); font-size:19px; font-weight:500; text-anchor:start}
#tooltip, #placement {position:absolute; z-index:2; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:9px; box-shadow:0 5px 18px #1610182c}
#tooltip {padding:6px 9px; pointer-events:none; width:max-content; max-width:min(290px,calc(100% - 8px)); overflow-wrap:anywhere; font-size:12px}
#placement {top:8px; left:8px; padding:5px 6px 5px 10px; display:flex; align-items:center; gap:8px}
.viewport-tools {position:absolute; z-index:1; inset:auto 8px 8px; display:flex; justify-content:space-between; pointer-events:none}
.viewport-tools div {display:flex; gap:4px}
.viewport-tools button {pointer-events:auto; background:var(--paper); min-width:34px; padding:4px 7px}
#details {background:var(--paper); border-left:1px solid var(--line); flex:0 0 clamp(240px,26%,340px); overflow:auto; overscroll-behavior:contain}
.detail-head {position:sticky; top:0; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:7px; background:var(--paper); padding:12px; border-bottom:1px solid var(--line)}
.detail-head h2 {font-size:18px}
.detail-head p {font-size:12px; color:var(--sub)}
.detail-head button {font-size:20px; width:36px; padding:2px 8px; background:transparent}
#detail-body {padding:10px 12px 13px; display:flex; flex-direction:column; gap:9px}
#detail-body h3 {font-size:13px; margin-top:4px}
#detail-body p, #detail-body li {overflow-wrap:anywhere}
.rows {margin:0; display:flex; flex-direction:column; gap:4px}
.rows div {display:flex; gap:8px; justify-content:space-between; align-items:baseline}
dt {color:var(--sub); min-width:42%}
dd {margin:0; text-align:right; overflow-wrap:anywhere}
.compact-list {list-style:none; padding:0; margin:0; display:grid; gap:3px}
.compact-list li {padding:6px 0; border-bottom:1px solid var(--line)}
.compact-list li:last-child {border:0}
.actions {display:flex; flex-wrap:wrap; gap:5px}
.actions button {flex:1 0 auto}
form {display:grid; gap:7px}
form label {display:grid; gap:3px; color:var(--sub); font-size:12px}
form :is(input,select,textarea) {width:100%; min-width:0; min-height:37px; padding:6px 7px; font-size:15px; color:var(--ink)}
.vehicle-type {display:grid; gap:3px}
.vehicle-type-trigger, .vehicle-type-option {display:flex; align-items:center; gap:8px; padding:3px 8px; text-align:left; font-size:15px; font-weight:500}
.vehicle-type-trigger {width:100%; min-height:37px}
.vehicle-type-trigger[aria-expanded="true"] {border-color:var(--accent)}
.vehicle-type-value {flex:1}
.vehicle-type-art {display:block; width:16px; height:27px; flex:none}
.vehicle-type-arrow, .vehicle-type-check {width:14px; height:14px; flex:none}
.vehicle-type-options {position:fixed; z-index:4; max-height:min(22rem, var(--vehicle-options-room)); overflow-y:auto; overscroll-behavior:contain; padding:3px; border:1px solid var(--line); border-radius:8px; background:var(--paper); box-shadow:0 5px 18px #1610182c}
.vehicle-type-option {min-height:33px; border-radius:5px; cursor:pointer}
.vehicle-type-option[data-active], .vehicle-type-option:hover {background:var(--tint)}
.vehicle-type-option[aria-selected="true"] {font-weight:650}
.vehicle-type-check {margin-left:auto; visibility:hidden}
.vehicle-type-option[aria-selected="true"] .vehicle-type-check {visibility:visible}
textarea {min-height:59px; resize:vertical}
.form-note, .subtle {color:var(--sub); font-size:12px}
.form-error {color:var(--working); font-size:12px}
.workspace > footer {display:flex; gap:10px; align-items:center; padding:6px 10px; border-top:1px solid var(--line); color:var(--sub); font-size:11px}
.workspace > footer span {display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.workspace > footer .web-help {margin-left:auto}
.aura {width:6px; height:6px; border-radius:50%; background:var(--tone); box-shadow:0 0 0 3px color-mix(in srgb, var(--tone) 24%, transparent)}
.ready {--tone:var(--ready)}
.working {--tone:var(--working)}
.waiting {--tone:var(--waiting)}
@media (max-width:740px) {
  .toolbar {padding:6px 8px; gap:5px}
  .heading, #filters {width:100%}
  .heading time {font-size:11px}
  #filters button {min-height:36px; padding:4px 9px}
  #details {position:absolute; z-index:3; inset:auto 0 0; max-height:min(71%, 380px); min-height:105px; overflow:auto; border:1px solid var(--line); border-radius:15px 15px 0 0; box-shadow:0 -7px 24px #140b1730}
  .detail-head {padding:8px 10px}
  #detail-body {padding:8px 10px 10px; gap:7px}
  #detail-body button, .detail-head button, .viewport-tools button {min-height:42px}
  #detail-body form :is(input,select,textarea) {font-size:16px}
  .vehicle-type-trigger, .vehicle-type-option {font-size:16px}
  .vehicle-type-options {max-height:min(16rem, var(--vehicle-options-room))}
  .vehicle-type-option {min-height:40px}
  footer .web-help {display:none}
}
@media (pointer:coarse) {#tooltip, footer .web-help {display:none !important}}

.guest-notes {border-top:1px solid var(--line); padding:7px 0 2px}
.guest-notes summary {cursor:pointer; font-weight:650}
.guest-notes > div {padding-top:5px}
.cabin-summary, .cabin-extra > div, .cabin-extra-content {display:grid; gap:8px; min-width:0}
.cabin-extra {border-top:1px solid var(--line); padding-top:8px; scroll-margin-top:60px}
.cabin-extra h3 {color:var(--ink)}
.cabin-actions button[aria-expanded="true"] {border-color:var(--accent); background:var(--tint)}
.cabin-fields {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px}
.cabin-extra .check {display:flex; align-items:center; gap:7px; width:fit-content}
.cabin-extra .check input {width:16px; min-height:0; accent-color:var(--accent)}
.cabin-reservations {display:grid; gap:5px; min-width:0}
.cabin-reservations:not(:has(> .reservation-list:not([hidden]), > p:not([hidden]))) {display:none}
.reservation-list {display:grid; gap:5px}
.reservation-picker summary, .reservation-readonly {display:flex; align-items:center; justify-content:space-between; gap:6px; min-height:30px; list-style:none}
.reservation-picker summary {cursor:pointer}
.reservation-picker summary::-webkit-details-marker {display:none}
.reservation-picker[open] {display:grid; gap:5px}
.reservation-label {min-width:0; overflow-wrap:anywhere; font-size:12px; color:var(--sub)}
.reservation-tag {display:inline-flex; align-items:center; gap:5px; flex:none; max-width:65%; border-radius:5px; padding:4px 7px; background:var(--tag,var(--free)); color:var(--ink); font-size:11px; font-weight:700}
.reservation-tag[data-state="pendiente"] {--tag:var(--departure)}
.reservation-tag[data-state="confirmada"] {--tag:var(--arrival)}
.reservation-tag[data-state="hospedada"] {--tag:var(--continuing)}
.reservation-tag[data-state="checked_out"] {--tag:var(--checkout)}
.reservation-tag[data-state="cancelada"], .reservation-tag[data-state="no_show"] {--tag:var(--blocked)}
.reservation-picker summary .reservation-tag::after {content:"⌄"; flex:none}
.reservation-options {display:grid; padding:3px; gap:1px; border:1px solid var(--line); border-radius:8px; background:var(--page)}
.reservation-options button {display:grid; gap:2px; padding:5px 7px; min-height:30px; text-align:left; border-color:transparent; background:transparent; font-size:12px}
.reservation-options button:not(:disabled):is(:hover,:focus-visible), .reservation-options [aria-current="true"] {background:var(--tint)}
.reservation-options small {font-size:11px; font-weight:400; color:var(--sub)}
.reservation-confirm {display:grid; gap:6px; padding:6px 4px}
.reservation-confirm p, .cabin-reservations > p {font-size:12px}
.cabin-summary:has(+ .cabin-reservations[data-multiple]) .cabin-outgoing {display:none}
.reservation-list[aria-busy="true"] {opacity:.68}
#seccion-huespedes.hu-en-mapa {
  --guest-bg:var(--paper);
  --guest-surface:var(--paper);
  --guest-soft:var(--page);
  --guest-selected:var(--tint);
  --guest-border:var(--line);
  --guest-ink:var(--ink);
  --guest-muted:var(--sub);
  --guest-accent:#78263f;
  --guest-link:#285675;
  --guest-warn:#f4e7ce;
  --guest-warn-text:#73511e;
  --cereza-primario:var(--accent);
  --cereza-sobre-primario:var(--accent-ink);
  padding:0!important;
  font-family:inherit;
  min-width:0;
}
[data-theme="dark"] #seccion-huespedes.hu-en-mapa {
  --guest-accent:#f0adbf;
  --guest-link:#b2d8f2;
  --guest-warn:#443727;
  --guest-warn-text:#efd099;
}
#seccion-huespedes .hu-ficha {border:0; padding:0; gap:7px}
#detail-body #seccion-huespedes .hu-ficha h3 {font-size:18px; line-height:1.2; margin:0}
#seccion-huespedes .hu-perfil-identidad {min-height:0; gap:5px}
#seccion-huespedes .hu-perfil-identidad .hu-identidad {gap:7px}
#seccion-huespedes .hu-perfil-identidad > .hu-boton {flex:none; padding-inline:5px}
#seccion-huespedes .hu-avatar.hu-avatar-perfil {width:35px; height:35px}
#seccion-huespedes .hu-integrante {min-height:0; gap:6px}
#seccion-huespedes .hu-integrante .hu-identidad {gap:7px}
#seccion-huespedes .hu-integrante > .hu-boton {flex:none; min-width:0; padding-inline:7px}
#seccion-huespedes .hu-boton {white-space:normal; overflow-wrap:anywhere}
#seccion-huespedes :is(button,summary) {-webkit-tap-highlight-color:#a64f6d24}
#seccion-huespedes .hu-base dd {text-align:left}
#seccion-huespedes .hu-base dt {min-width:0}
#seccion-huespedes .hu-empty {padding:8px 0}
#seccion-huespedes .hu-dialogo {overscroll-behavior:contain}
#seccion-huespedes .vehicle-type-trigger {text-align:left; background:var(--guest-soft)}
#detail-body #seccion-huespedes .hu-dialogo h3 {font-size:19px; line-height:1.25; margin:0}
.cabin-extra:has(.hu-en-mapa:not([hidden])) ~ .guest-notes,
.cabin-actions:has([data-guest-view][aria-expanded="true"]) .primary {display:none}
@media (max-width:740px) {
  .cabin-extra {padding-top:6px}
  .cabin-staff {grid-template-columns:1fr}
  .cabin-extra .check {min-height:34px}
  .reservation-picker summary, .reservation-readonly {min-height:40px}
  .reservation-tag {padding-block:6px}
  #details:has([data-guest-view][aria-expanded="true"]) {max-height:min(83%,550px)}
  #detail-body #seccion-huespedes .hu-boton {min-height:38px}
  #detail-body #seccion-huespedes .hu-contexto .hu-boton,
  #detail-body #seccion-huespedes .hu-subtitulo .hu-boton {min-height:33px}
}
</style>
</head>
<body>
<main class="workspace">
  <header class="toolbar">
    <div class="heading"><h1>Mapa del recinto</h1><time id="day"></time><button id="reload" type="button" aria-label="Actualizar mapa" title="Actualizar mapa">↻</button><button id="add" class="primary" type="button" disabled>＋ Agregar</button></div>

      <button type="button" data-filter="all" aria-pressed="true">Todo</button>

      <button type="button" data-filter="parking">Vehículos</button>
      <button type="button" data-filter="services">Servicios</button>
      <button type="button" data-filter="people">Personas</button>
      <button type="button" data-filter="tasks">Tareas</button>

    <p id="status" role="status" hidden></p>

function cabinCleaning(body, n, date) {
  const slot = el('div', '', 'cabin-extra-content');
  body.append(slot, button('Abrir en Cabañas', () => send({type:'navigate', method:'cleaning', args:{number:n, fecha:date}})));
  const target = {p_numero:n,p_fecha:date};
  async function load() {
    const loading = el('p', 'Cargando aseo…', 'subtle');
    loading.setAttribute('role','status');
    slot.replaceChildren(loading);
    try {
      const record = await request('cleaning', target);
      if (!slot.isConnected) return;
      if (!record?.puede_leer) slot.replaceChildren(el('p','La ficha de aseo requiere permiso de lectura.','subtle'));
      else if (record.puede_editar) edit(record);
      else slot.replaceChildren(lines([
        ['Estado', cleaning({aseo_estado:record.estado})[0]], ['Encargado', record.encargado], ['Revisor', record.revisor],
        ['IN', formatTime(record.inicio)], ['OUT', formatTime(record.fin)], ['Observación', record.observacion],
      ]));
    } catch (error) {
      if (slot.isConnected) slot.replaceChildren(el('p', error.message, 'form-error'), button('Reintentar', load));
    }
  }
  function edit(record, message = '') {
    const box = el('form');
    const staff = el('div', '', 'cabin-fields cabin-staff'), hours = el('div', '', 'cabin-fields');
    staff.append(input('encargado','Encargado',record.encargado,{limit:80}), input('revisor','Revisor',record.revisor,{limit:80}));
    hours.append(input('inicio','Hora IN',formatTime(record.inicio),{type:'time'}), input('fin','Hora OUT',formatTime(record.fin),{type:'time'}));
    const check = el('input');
    check.type = 'checkbox';
    check.name = 'no_requiere';
    check.checked = record.estado === 'no_requiere';
    const noCleaning = field('No requiere aseo', check);
    noCleaning.className = 'check';
    const feedback = el('div');
    const status = el('p', message, 'subtle');
    status.setAttribute('role','status');
    feedback.append(status);
    const save = el('button','Guardar aseo','primary');
    save.type = 'submit';
    box.append(staff, hours, input('observacion','Observación',record.observacion,{multiline:true,limit:1000}), noCleaning, feedback, save);
    const fields = [...box.querySelectorAll('input,textarea')];
    const values = () => Object.fromEntries(fields.map(control => [control.name, control.type === 'checkbox' ? control.checked : control.value.trim()]));
    const original = values();
    const changes = () => Object.fromEntries(Object.entries(values()).filter(([key,value]) => value !== original[key]));
    function sync() {
      const haveHours = Boolean(box.elements.inicio.value || box.elements.fin.value);
      box.elements.inicio.disabled = check.checked;
      box.elements.fin.disabled = check.checked;
      check.disabled = haveHours && !check.checked;
      save.disabled = !Object.keys(changes()).length;
    }
    box.addEventListener('input', sync);
    box.addEventListener('submit', async event => {
      event.preventDefault();
      if (save.disabled || state.saving) return;
      state.saving = true;
      const patch = changes();
      const disabled = fields.map(control => control.disabled);
      fields.forEach(control => { control.disabled = true; });
      save.disabled = byId('close').disabled = true;
      save.textContent = 'Guardando…';
      try {
        const next = await request('cleaning', { ...target, p_version:record.version, p_cambios:patch });
        if (slot.isConnected) edit(next, 'Aseo guardado.');
        await refresh(true);
      } catch (error) {
        if (slot.isConnected) {
          const alert = el('p', error.message, 'form-error');
          alert.setAttribute('role','alert');
          feedback.replaceChildren(alert);
          if (error.code === '40001') feedback.append(button('Actualizar aseo', load));
        }
      } finally {
        state.saving = false;
        byId('close').disabled = false;
        fields.forEach((control, index) => { control.disabled = disabled[index]; });
        save.textContent = 'Guardar aseo';
        sync();
      }
    });
    slot.replaceChildren(box);
    sync();
  }
  void load();
}
function loadGuestAssets() {
  if (window.HAIKU_ICONOS_FICHA_MAPA_V1) return Promise.resolve();
  if (guestAssets) return guestAssets;
  function load(node) {
    return new Promise((resolve, reject) => {
      node.onload = resolve;
      node.onerror = () => reject(new Error('No se pudo cargar la ficha.'));
      document.head.append(node);
    });
  }
  const assets = [
    ...['haiku-huespedes-v1', 'haiku-huespedes-figma-v1'].map(name => {
      const sheet = el('link');
      sheet.rel = 'stylesheet';
      sheet.href = '../../css/' + name + '.css?v=mapa1';
      return sheet;
    }),
    Object.assign(el('script'), {src:'../../js/haiku-huespedes-v1.js?v=mapa4'}),
  ];
  guestAssets = Promise.all(assets.map(load)).catch(error => {
    assets.forEach(node => node.remove());
    guestAssets = null;
    throw error;
  });
  return guestAssets;
}
function encodePhoto(photo) {
  if (typeof photo === 'string' || photo === null) return Promise.resolve(photo);
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({jpeg:reader.result.split(',')[1]});
    reader.onerror = () => reject(new Error('No se pudo preparar la foto.'));
    reader.readAsDataURL(photo);
  });
}

function serviceGroup(code) {

  if (code === 'tinajaJacuzzi') return 'jacuzzi';
  return /^masaje/i.test(code) ? 'masajes' : '';
}
function showZone(id, focus) {
  const zone = zones[id];
  showPanel(zone.title, zone.service ? 'Agenda de hoy' : zone.kind, focus);
  if (zone.service) {
    const entries = data().agenda.filter(entry => serviceGroup(entry.codigo) === id);
    if (entries.length) {
      const rows = el('ul', '', 'compact-list');
      for (const entry of entries) rows.append(el('li', [entry.hora?.slice(0, 5), entry.nombre, entry.numero && 'CAB ' + entry.numero].filter(Boolean).join(' · ')));
      detailBody.append(rows);
    } else detailBody.append(el('p', data().permisos.agenda ? 'Sin horas agendadas.' : 'Agenda no disponible para tu sesión.', 'subtle'));
    if (data().permisos.servicio) actions(button('Reservar hora', () => serviceForm(id), 'primary'));
    return;
  }
  if (id === 'lavanderia') {
    const entry = data().elementos.find(e => e.tipo === 'lavanderia');
    const values = entry?.datos || {};
    const general = data().lavanderia;
    detailBody.append(lines([
      ['A cargo', values.encargado || general?.encargado], ['Canastas listas', values.canastas],
      ['Lencería lista', values.lenceria], ['Lavando', values.lavando], ['Faltantes', values.faltantes], ['Nota de turno', general?.nota]
    ]));
    if (data().permisos.lavanderia) actions(button('Editar lavandería', () => laundryForm(entry), 'primary'));
    return;
  }
  const people = data().elementos.filter(e => e.tipo === 'persona' && Math.hypot(e.x-zone.center[0], e.y-zone.center[1]) < (id === 'verde' ? 115 : 62));
  if (people.length) actions(...people.map(e => button(personName(e), () => showDetail('m-' + e.id))));
  if (data().permisos.persona && ['piscina','verde','muelle','orilla'].includes(id)) actions(button('Ubicar huésped', () => markerForm('persona', { x:zone.center[0], y:zone.center[1] })));
  if (data().permisos.tarea) actions(button('Anotar tarea', () => placeMarker('tarea')));
}
function showMarker(entry, focus) {
  if (entry.tipo === 'persona') {
    showPanel(personName(entry), 'Ubicación registrada', focus);
    if (data().permisos.huesped) actions(button('Nota o preferencia', () => guestForm({ id:entry.datos.persona_id, nombre:personName(entry) }, entry.reserva_id, 'm-' + entry.id), 'primary'));
    actions(button('Ver huésped', () => openGuest({ id:entry.datos.persona_id }, entry.reserva_id)));
  } else {
    showPanel(categories[entry.datos.categoria] || 'Tarea', taskStates[entry.datos.estado] || '', focus);
    detailBody.append(el('p', entry.datos.nota));
    detailBody.append(lines([['Responsable', entry.datos.responsable]]));
  }
  if (data().permisos[entry.tipo]) actions(
    entry.tipo === 'tarea' && button('Editar', () => markerForm(entry.tipo, entry, entry)),
    button('Mover', () => placeMarker(entry.tipo, entry)),
    button('Quitar', () => confirmChange(entry, 'retirar', 'm-' + entry.id, 'Quitar del mapa'))
  );
}

  actions(

    allowed.tarea && button('Tarea', () => placeMarker('tarea')),

function chooseBay() {
  showPanel('Elegir puesto', 'Vehículos');
  const available = parkingNumbers.filter(n => !bayRecord(n));
  if (!available.length) detailBody.append(el('p', 'Todos los puestos tienen un vehículo registrado.'));
  else actions(...available.map(n => button(parkingSlot(n).label || String(n), () => vehicleForm(n))));

function selectField(name, label, values, selected = '', required = false) {
  const control = el('select');
  control.name = name;
  control.required = required;
  for (const entry of values) {
    const [id, title] = Array.isArray(entry) ? entry : [entry, entry];
    const option = el('option', title);
    option.value = id;
    control.append(option);
  }
  control.value = selected;
  return field(label, control);
}
function vehicleTypeField(selected, colorInput, {name = 'vehiculo', disabled = false, preserveLegacy = false} = {}) {
  const types = preserveLegacy && selected && !vehicleTypes.includes(selected) ? [selected, ...vehicleTypes] : vehicleTypes;
  const suffix = name === 'vehiculo' ? '' : '-' + name;
  const wrapper = el('div', '', 'vehicle-type');
  const label = el('label', 'Tipo de vehículo');
  label.id = 'vehicle-type-label' + suffix;
  label.htmlFor = 'vehicle-type-trigger' + suffix;
  const value = el('input');
  value.type = 'hidden';
  value.name = name;
  value.value = types.includes(selected) ? selected : 'Otro';
  const trigger = button('', () => list.hidden ? open() : close(), 'vehicle-type-trigger');
  trigger.disabled = disabled;
  const icon = vehicleTypeIcon(value.value);
  const updateColor = () => setVehicleColor(icon, colorInput.value);
  updateColor();
  colorInput.addEventListener('input', updateColor);
  const caption = el('span', value.value, 'vehicle-type-value');
  caption.id = 'vehicle-type-value' + suffix;
  trigger.id = label.htmlFor;
  trigger.setAttribute('role', 'combobox');
  trigger.setAttribute('aria-labelledby', label.id + ' ' + caption.id);
  trigger.setAttribute('aria-expanded', 'false');
  const list = el('div', '', 'vehicle-type-options');
  list.id = 'vehicle-type-options' + suffix;
  list.hidden = true;
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-labelledby', label.id);
  trigger.setAttribute('aria-controls', list.id);
  trigger.append(icon, caption, indicator('M3 5l4 4 4-4', 'vehicle-type-arrow'));
  let active = 0, openEvents;
  const options = types.map((type, index) => {
    const option = el('div', '', 'vehicle-type-option');
    option.id = list.id + '-' + index;
    option.setAttribute('role', 'option');
    option.setAttribute('aria-selected', String(type === value.value));
    option.append(vehicleTypeIcon(type), el('span', type), indicator('M2.5 7l3 3 6-6', 'vehicle-type-check'));
    option.addEventListener('click', () => choose(index));
    return option;
  });
  list.append(...options);
  wrapper.append(label, value, trigger, list);

  function indicator(path, cls) {
    const svg = createSvg('svg', { class:cls, viewBox:'0 0 14 14', 'aria-hidden':'true' });
    svg.append(createSvg('path', { d:path, fill:'none', stroke:'currentColor', 'stroke-width':1.5, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
    return svg;
  }
  function highlight(index) {
    delete options[active].dataset.active;
    active = Math.max(0, Math.min(index, options.length - 1));
    const option = options[active];
    option.dataset.active = '';
    trigger.setAttribute('aria-activedescendant', option.id);
    const top = option.offsetTop, bottom = top + option.offsetHeight;
    if (top < list.scrollTop) list.scrollTop = top;
    else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight;
  }
  function close() {
    if (list.hidden) return;
    list.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    trigger.removeAttribute('aria-activedescendant');
    openEvents.abort();
  }
  function open() {
    if (state.saving) return;
    const rect = trigger.getBoundingClientRect();
    const gap = 4;
    const below = innerHeight - rect.bottom - 2 * gap;
    const above = rect.top - 2 * gap;
    const upward = below < Math.min(above, 352);
    const width = Math.min(Math.max(rect.width, name === 'tipo' ? 185 : 0), innerWidth - 2 * gap);
    list.style.left = Math.min(rect.left, innerWidth - width - gap) + 'px';
    list.style.width = width + 'px';
    list.style.top = upward ? 'auto' : rect.bottom + gap + 'px';
    list.style.bottom = upward ? innerHeight - rect.top + gap + 'px' : 'auto';
    list.style.setProperty('--vehicle-options-room', Math.max(0, upward ? above : below) + 'px');
    openEvents = new AbortController();
    const events = { signal:openEvents.signal };
    document.addEventListener('pointerdown', event => { if (!wrapper.contains(event.target)) close(); }, events);
    document.addEventListener('scroll', event => { if (!list.contains(event.target)) close(); }, {...events,capture:true});
    window.addEventListener('resize', close, events);
    list.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    trigger.focus({ preventScroll:true });
    highlight(types.indexOf(value.value));
  }
  function choose(index) {
    options[types.indexOf(value.value)].setAttribute('aria-selected', 'false');
    options[index].setAttribute('aria-selected', 'true');
    value.value = types[index];
    caption.textContent = value.value;
    paintVehicle(icon, value.value);
    close();
  }
  list.addEventListener('mousedown', event => { if (event.target.closest('[role="option"]')) event.preventDefault(); });
  trigger.addEventListener('blur', close);
  trigger.addEventListener('keydown', event => {
    if (state.saving) return;
    const key = event.key;
    if (key === 'Tab') {
      if (!list.hidden) choose(active);
      return;
    }
    if (key === 'Escape') {
      if (list.hidden) return;
      event.stopPropagation();
      close();
    } else if (key === 'Enter' || key === ' ') {
      if (list.hidden) open(); else choose(active);
    } else if (key === 'ArrowDown' || key === 'ArrowUp') {
      if (list.hidden) open(); else highlight(active + (key === 'ArrowDown' ? 1 : -1));
    } else if (key === 'Home' || key === 'End') {
      if (list.hidden) open();
      highlight(key === 'Home' ? 0 : options.length - 1);
    } else return;
    event.preventDefault();
  });
  return {
    element:wrapper,
    select(type) {
      const index = types.indexOf(type);
      choose(index < 0 ? types.indexOf('Otro') : index);
    },
  };
}
function vehicleTypeIcon(type) {
  const icon = createSvg('svg', { class:'vehicle-type-art', viewBox:'0 0 24 56', 'aria-hidden':'true' });
  paintVehicle(icon, type);
  return icon;
}
function field(label, control) {
  const wrapper = el('label', label);
  control.setAttribute('aria-label', label);
  wrapper.append(control);
  return wrapper;
}
function input(name, title, value = '', options = {}) {
  const control = el(options.multiline ? 'textarea' : 'input');
  if (!options.multiline) control.type = options.type || 'text';
  control.name = name;
  control.value = value ?? '';
  if (options.limit) control.maxLength = options.limit;
  if (options.min !== undefined) control.min = options.min;
  if (options.max !== undefined) control.max = options.max;
  control.required = options.required === true;
  return field(title, control);
}
function form(title, caption, fields, onSave, back, submitLabel = 'Guardar') {
  state.formOpen = true;
  showPanel(title, caption);
  const box = el('form');
  const feedback = el('p', '', 'form-error');
  feedback.setAttribute('role', 'alert');
  feedback.hidden = true;
  const submit = el('button', submitLabel, 'primary');
  submit.type = 'submit';
  const controls = el('div', '', 'actions');
  const cancel = button('Volver', () => back ? showDetail(back) : closeDetail());
  controls.append(cancel, submit);
  box.append(...fields, feedback, controls);
  box.addEventListener('submit', async event => {
    event.preventDefault();
    if (submit.disabled) return;
    const values = Object.fromEntries(new FormData(box));
    state.saving = true;
    submit.disabled = true;
    cancel.disabled = true;
    byId('close').disabled = true;
    submit.textContent = 'Guardando…';
    feedback.hidden = true;
    try {
      const next = await onSave(values);
      state.formOpen = false;
      state.selection = '';
      await refresh(true);
      if (next) showDetail(next);
      else closeDetail();
    } catch (error) {
      feedback.textContent = error.message;
      feedback.hidden = false;
    } finally {
      state.saving = false;
      submit.disabled = false;
      cancel.disabled = false;
      byId('close').disabled = false;
      submit.textContent = submitLabel;
    }
  });
  detailBody.append(box);
}
function changes(type, entry) {
  const id = entry?.id || newId();
  let last = null;
  return {
    id,
    run(action, values) {
      const key = JSON.stringify([action, values]);
      if (last?.key !== key) last = { key, operation:newId() };
      return request('save', {
        p_id:id, p_tipo:type, p_revision:entry?.revision || 0, p_accion:action,
        p_datos:values, p_operacion:last.operation,
      });
    },
  };
}
function confirmChange(entry, action, back, title) {
  const change = changes(entry.tipo, entry);
  form(title, '', [el('p', entry.tipo === 'vehiculo' ? entry.datos.patente : 'Confirma el cambio del marcador.')],
    async () => { await change.run(action, {}); return back; }, back, 'Confirmar');
}
function vehicleForm(number, entry) {
  const values = entry?.datos || {};
  const change = changes('vehiculo', entry);
  const color = input('color','Color',values.color,{limit:80});
  const model = input('modelo','Modelo',values.modelo,{limit:120});
  const plate = input('patente','Patente',values.patente,{limit:30,required:true});
  const type = vehicleTypeField(values.vehiculo || 'Sedán', color.querySelector('input'));
  const slots = parkingNumbers.filter(n => n === number || !bayRecord(n)).map(n => [String(n), parkingTitle(n)]);
  const spotField = selectField('puesto', 'Puesto', slots, String(number), true);
  const stays = getTargets();
  function stayLabel(reserve, name) {
    const numbers = [...new Set(stays.filter(stay => stay.reserve === reserve).map(stay => stay.row.numero))];
    return numbers.length ? 'CAB ' + numbers.sort((a, b) => a - b).join(', ') + ' · ' + name : name;
  }
  const linked = new Map(data().personas.filter(p => p.rol === 'titular')
    .map(p => [p.reserva_id, stayLabel(p.reserva_id, p.nombre)]));
  if (entry?.reserva_id && !linked.has(entry.reserva_id)) {
    linked.set(entry.reserva_id, stayLabel(entry.reserva_id, 'Estadía vinculada'));
  }
  const stayField = selectField('reserva_id', 'Estadía', [['','Sin vínculo'], ...linked], entry?.reserva_id || '');
  const choice = selectField('vehiculo_id','Vehículo de la estadía',[['','Registrar otro vehículo']], '');
  const spot = spotField.querySelector('select');
  const reservation = stayField.querySelector('select'), vehicles = choice.querySelector('select');
  const status = el('p', '', 'subtle');
  status.setAttribute('role','status');
  status.hidden = choice.hidden = true;
  let candidates = [], selected, sequence = 0;
  let previousReserve = reservation.value;

  function fill(vehicle) {
    type.select(vehicle?.tipo || values.vehiculo || 'Sedán');
    plate.querySelector('input').value = vehicle ? vehicle.patente ?? '' : values.patente ?? '';
    model.querySelector('input').value = vehicle ? vehicle.modelo ?? '' : values.modelo ?? '';
    const colorInput = color.querySelector('input');
    colorInput.value = vehicle ? vehicle.color ?? '' : values.color ?? '';
    colorInput.dispatchEvent(new Event('input'));
  }

  async function loadVehicles() {
    const revision = ++sequence;
    if (selected) fill();
    selected = undefined;
    candidates = [];
    vehicles.options.length = 1;
    vehicles.value = '';
    status.hidden = choice.hidden = true;
    const reserve = reservation.value;
    if (!reserve || (reserve === entry?.reserva_id && entry.vehiculo_id)) return;
    const guest = cabinGuest({ reserve });
    if (!guest) return;
    status.textContent = 'Buscando vehículos de la estadía…';
    status.hidden = false;
    try {
      const profile = await request('guestDetail', {p_id:guest.id,p_reserva:reserve});
      if (!reservation.isConnected || revision !== sequence) return;
      const assigned = new Set(data().elementos.filter(e => e.tipo === 'vehiculo' && e.id !== entry?.id)
        .map(e => e.vehiculo_id));
      candidates = list(profile.vehiculos).filter(vehicle => !vehicle.estacionamiento && !assigned.has(vehicle.id));
      for (const vehicle of candidates) {
        const option = el('option', [vehicle.modelo || vehicle.tipo, vehicle.patente].filter(Boolean).join(' · '));
        option.value = vehicle.id;
        vehicles.append(option);
      }
      choice.hidden = !candidates.length;
      status.hidden = true;
    } catch {
      if (!reservation.isConnected || revision !== sequence) return;
      status.textContent = 'No se pudieron consultar los vehículos de esta estadía.';
    }
  }

  reservation.addEventListener('change', loadVehicles);
  function syncSpot() {
    const owner = parkingSlot(spot.value)?.owner === true;
    if (owner === reservation.disabled) return;
    if (owner) {
      previousReserve = reservation.value;
      reservation.value = '';
    } else {
      reservation.value = previousReserve;
    }
    stayField.hidden = reservation.disabled = owner;
    void loadVehicles();
  }
  spot.addEventListener('change',syncSpot);
  vehicles.addEventListener('change', () => {
    selected = candidates.find(vehicle => vehicle.id === vehicles.value);
    fill(selected);
  });
  form(entry ? 'Editar vehículo' : 'Registrar vehículo', parkingTitle(number), [
    spotField,
    stayField, status, choice, type.element, plate, model,
    color,
    ...(!entry ? [selectField('estacionado','Presencia',[['true','Estacionado'],['false','Fuera del recinto']],'true')] : []),
    input('hora','Hora de llegada (Chile)','',{type:'time'}),
    input('nota','Nota',values.nota,{multiline:true,limit:500}),
  ], async ({ hora, vehiculo_id, ...fields }) => {
    if (hora) fields.llegada = data().fecha + 'T' + hora;
    if (selected && selected.id === vehiculo_id) {
      fields.vehiculo_id = vehiculo_id;
      fields.vehiculo_version = selected.fecha;
    }
    await change.run('guardar', fields);
    return 'p' + fields.puesto;
  }, 'p' + number);
  if (parkingSlot(number).owner) syncSpot();
  else void loadVehicles();
}
function getTargets() {
  const targets = [];
  for (const row of data().cabanas) {
    for (const flag of ['continua', 'ingreso', 'fullday', 'salida']) {
      if (flag === 'salida' && row.salida_checkout_en) continue;
      const reserve = row[flag + '_reserva_id'], id = row[flag + '_estadia_id'];
      if (!reserve || !id || targets.some(t => t.id === id)) continue;
      targets.push({ reserve, id, row, flag, title:'CAB ' + row.numero + ' · ' + (row[flag + '_titular'] || 'Reserva') });
    }
  }
  return targets;
}

  const change = changes(kind, entry), d = entry?.datos || {};
  const guests = data().personas.filter(p => p.hospedado === true);
  const personKey = d.persona_id ? d.persona_id + '/' + entry.reserva_id : '';

    ? [selectField('persona', 'Huésped', [['','Selecciona un huésped'], ...guests.map(p => [p.id + '/' + p.reserva_id, p.nombre])], personKey, true)]

function serviceForm(zone) {
  const catalog = data().catalogo.filter(c => serviceGroup(c.codigo) === zone);
  const targets = getTargets();
  if (!catalog.length || !targets.length) {
    detailBody.append(el('p', 'Debe haber una estadía de hoy y un servicio activo para reservar.', 'subtle'));
    return;
  }
  form('Reservar hora', zones[zone].title, [
    selectField('estadia', 'Estadía', [['','Selecciona una estadía'], ...targets.map(t => [t.id,t.title])],'',true),
    selectField('codigo','Servicio', catalog.map(c => [c.codigo, c.nombre + (c.minutos ? ' · ' + c.minutos + ' min' : '')]), catalog[0].codigo, true),
    input('hora','Hora','',{type:'time',required:true}),
    input('personas','Personas','1',{type:'number',min:'1',max:'99',required:true}),
    input('observaciones','Observaciones','',{multiline:true,limit:300}),
    el('p', 'La hora se agrega con el cobro normal del catálogo.', 'form-note'),
  ], async fields => {
    const target = targets.find(t => t.id === fields.estadia);
    if (!target) throw new Error('Selecciona una estadía.');
    await request('service', {
      p_reserva_id:target.reserve, p_estadia_id:target.id, p_codigo_servicio:fields.codigo,
      p_fecha_servicio:data().fecha, p_hora:fields.hora, p_cantidad:1, p_personas:Number(fields.personas),
      p_tipo_cobro:'normal', p_observaciones:fields.observaciones || null,
    });
    return zone;
  }, zone, 'Agendar');
}
function placeMarker(kind, entry) {
  closeDetail();
  state.placing = { kind, entry };
  byId('placement').hidden = false;
  viewport.classList.add('placing');
}
function cancelPlacement() {
  state.placing = null;
  byId('placement').hidden = true;
  viewport.classList.remove('placing');
}
function pickAt(position, reference) {
  if (state.saving) return;
  if (!state.placing) { if (reference) showDetail(reference); return; }
  const x = (position.x-view.x)/view.scale, y = (position.y-view.y)/view.scale;
  if (x < 0 || x > width || y < 0 || y > height) return;
  const { kind, entry } = state.placing;
  cancelPlacement();
  markerForm(kind, { x:+x.toFixed(2), y:+y.toFixed(2) }, entry);
}

const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
function renderCamera() {
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    world.style.transform = 'translate3d(' + view.x + 'px,' + view.y + 'px,0) scale(' + view.scale + ')';
    viewport.dataset.scale = view.scale.toFixed(5);
    viewport.dataset.x = view.x.toFixed(3);
    viewport.dataset.y = view.y.toFixed(3);
